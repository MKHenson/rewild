services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rewild
      POSTGRES_USER: rewild
      POSTGRES_PASSWORD: rewild
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rewild
      # MinIO requires >= 8 characters or the container exits at startup.
      # Must match S3_SECRET_KEY in server/.env.
      MINIO_ROOT_PASSWORD: rewild-dev
    ports:
      - "9000:9000"
      # Console on host 9090 — the web dev server owns 9001 (esbuild.js), and a
      # collision there stops the whole minio container from starting.
      - "9090:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
